version: '3.8'

services:
  kanzu-rafiki-adaptor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanzu-rafiki-adaptor
    ports:
      - "1000:1000"
    environment:
      - NODE_ENV=production
      - PORT=1000
      - KANZU_API_BASE_URL=${KANZU_API_BASE_URL:-http://localhost:8080}
      - KANZU_API_USERNAME=${KANZU_API_USERNAME:-admin}
      - KANZU_API_PASSWORD=${KANZU_API_PASSWORD:-admin}
      - GRAPHQL_ENDPOINT=${GRAPHQL_ENDPOINT:-https://staging-graph-rafiki.kanzubanking.com/graphql}
      - AUTH_DOMAIN=${AUTH_DOMAIN:-https://staging-auth-rafiki.kanzubanking.com}
      - AUTH_GRANT_DOMAIN=${AUTH_GRANT_DOMAIN:-https://staging-auth-grant-rafiki.kanzubanking.com}
      - AUTH_IDENTITY_SERVER_SECRET=${AUTH_IDENTITY_SERVER_SECRET:-2pEcn2kkCclbOHQiGNEwhJ0rucATZhrA807HTm2rNXE=}
      - WALLET_BASE_URL=${WALLET_BASE_URL:-https://happy-life-bank-backend}
      - MOMO_BASE_URL=${MOMO_BASE_URL:-http://localhost:8000}
      - MOCK_MOMO_BASE_URL=${MOCK_MOMO_BASE_URL:-http://localhost:5000}
      - EXCHANGE_RATES_URL=${EXCHANGE_RATES_URL:-http://api.exchangeratesapi.io/v1/}
      - EXCHANGE_RATES_ACCESS_KEY=${EXCHANGE_RATES_ACCESS_KEY:-my-exchange-rates-key}
      - AUTH_CLIENT_WALLET_ADDRESS=${AUTH_CLIENT_WALLET_ADDRESS:-https://staging-rafiki.kanzubanking.com/testdemo}
      - SENDER_WALLET_ADDRESS_URL=${SENDER_WALLET_ADDRESS_URL:-https://staging-rafiki.kanzubanking.com/testdemo}
      - SENDER_KEY_ID=${SENDER_KEY_ID:-8f8b6f67-a044-4c3c-bbd2-8de4cf1c5983}
      - SENDER_PRIVATE_KEY_PATH=${SENDER_PRIVATE_KEY_PATH:-/app/private.key}
      - OP_REQUEST_TIMEOUT_MS=${OP_REQUEST_TIMEOUT_MS:-120000}
      - OP_SEND_METHOD=${OP_SEND_METHOD:-ilp}
      - INTERACT_INITIAL_DELAY_MS=${INTERACT_INITIAL_DELAY_MS:-30000}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-10000}
      - POLL_MAX_WAIT_MS=${POLL_MAX_WAIT_MS:-300000}
    volumes:
      - ./tenants.env:/app/tenants.env:ro
      - ./testdemo_private.key:/app/private.key:ro  # mount key securely
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kanzu-network

  # Optional: Add a development service with hot reload
  kanzu-rafiki-adaptor-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kanzu-rafiki-adaptor-dev
    ports:
      - "1001:1000"
    environment:
      - NODE_ENV=development
      - PORT=1000
      - KANZU_API_BASE_URL=${KANZU_API_BASE_URL:-http://localhost:8080}
      - KANZU_API_USERNAME=${KANZU_API_USERNAME:-admin}
      - KANZU_API_PASSWORD=${KANZU_API_PASSWORD:-admin}
      - GRAPHQL_ENDPOINT=${GRAPHQL_ENDPOINT:-http://localhost:3011/graphql}
      - AUTH_DOMAIN=${AUTH_DOMAIN:-https://staging-auth-rafiki.kanzubanking.com}
      - AUTH_GRANT_DOMAIN=${AUTH_GRANT_DOMAIN:-https://staging-auth-grant-rafiki.kanzubanking.com}
      - AUTH_IDENTITY_SERVER_SECRET=${AUTH_IDENTITY_SERVER_SECRET:-replace-me}
      - WALLET_BASE_URL=${WALLET_BASE_URL:-https://happy-life-bank-backend}
      - MOMO_BASE_URL=${MOMO_BASE_URL:-http://localhost:8000}
      - MOCK_MOMO_BASE_URL=${MOCK_MOMO_BASE_URL:-http://localhost:5000}
      - EXCHANGE_RATES_URL=${EXCHANGE_RATES_URL:-http://api.exchangeratesapi.io/v1/}
      - EXCHANGE_RATES_ACCESS_KEY=${EXCHANGE_RATES_ACCESS_KEY:-my-exchange-rates-key}
      - AUTH_CLIENT_WALLET_ADDRESS=${AUTH_CLIENT_WALLET_ADDRESS:-https://staging-rafiki.kanzubanking.com/testdemo}
      - SENDER_WALLET_ADDRESS_URL=${SENDER_WALLET_ADDRESS_URL:-https://staging-rafiki.kanzubanking.com/testdemo}
      - SENDER_KEY_ID=${SENDER_KEY_ID:-8f8b6f67-a044-4c3c-bbd2-8de4cf1c5983}
      - SENDER_PRIVATE_KEY_PATH=${SENDER_PRIVATE_KEY_PATH:-/app/private.key}
      - OP_REQUEST_TIMEOUT_MS=${OP_REQUEST_TIMEOUT_MS:-120000}
      - OP_SEND_METHOD=${OP_SEND_METHOD:-ilp}
      - INTERACT_INITIAL_DELAY_MS=${INTERACT_INITIAL_DELAY_MS:-30000}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-10000}
      - POLL_MAX_WAIT_MS=${POLL_MAX_WAIT_MS:-300000}
    volumes:
      - ./src:/app/src
      - ./tenants.env:/app/tenants.env:ro
      - ./testdemo_private.key:/app/private.key:ro
      - /app/node_modules
    restart: unless-stopped
    profiles:
      - dev
    networks:
      - kanzu-network

networks:
  kanzu-network:
    driver: bridge



